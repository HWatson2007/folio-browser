<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Folio Browser</title>
  </head>
  <body>
    <main id="app">
      <header class="browser-bar" aria-label="Browser controls">
        <div class="brand" aria-label="Folio Browser">
          <span class="brand-mark">F</span>
          <span class="brand-name">Folio</span>
          <span id="profile-badge" class="profile-badge" title="Current profile"></span>
        </div>

        <nav class="nav-controls" aria-label="Page navigation">
          <button id="back-button" class="icon-button" type="button" title="Back (Alt+Left)" aria-label="Back">Back</button>
          <button id="forward-button" class="icon-button" type="button" title="Forward (Alt+Right)" aria-label="Forward">Next</button>
          <button id="reload-button" class="icon-button" type="button" title="Reload (Ctrl+R)" aria-label="Reload">Reload</button>
          <button id="home-button" class="icon-button" type="button" title="Home" aria-label="Home">Home</button>
        </nav>

        <form id="address-form" class="address-form" role="search">
          <span id="load-indicator" class="load-indicator" aria-hidden="true"></span>
          <label class="sr-only" for="address-input">Address or DuckDuckGo search</label>
          <input
            id="address-input"
            name="address"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Enter an address or search DuckDuckGo"
          />
          <button class="go-button" type="submit">Go</button>
        </form>

        <div class="section-buttons" aria-label="Browser records">
          <button id="downloads-button" class="section-button" type="button" aria-expanded="false" aria-controls="downloads-panel">
            Downloads <span id="downloads-count" class="section-count" hidden></span>
          </button>
          <button id="history-button" class="section-button" type="button" aria-expanded="false" aria-controls="history-panel">
            History
          </button>
        </div>
      </header>

      <section id="history-panel" class="history-panel" aria-hidden="true">
        <div class="ledger-heading">
          <div>
            <p class="eyebrow">The browsing ledger</p>
            <h1>History</h1>
            <p id="history-summary" class="history-summary">Every navigation attempt is kept on this device.</p>
          </div>
          <button id="close-history-button" class="close-button" type="button">Return to page</button>
        </div>

        <div class="history-tools">
          <label class="history-search-label" for="history-search">Search the ledger</label>
          <input id="history-search" type="search" placeholder="Title, URL, or exact search text" autocomplete="off" />
          <div class="export-actions" aria-label="Export browsing history">
            <button id="export-json-button" type="button">Export JSON</button>
            <button id="export-csv-button" type="button">Export CSV</button>
          </div>
        </div>

        <div id="history-list" class="history-list" aria-live="polite"></div>
      </section>

      <section id="downloads-panel" class="downloads-panel" aria-hidden="true">
        <div class="ledger-heading downloads-heading">
          <div>
            <p class="eyebrow">Files saved by this profile</p>
            <h1>Downloads</h1>
            <p id="downloads-summary" class="history-summary">The download record is kept on this device.</p>
          </div>
          <button id="close-downloads-button" class="close-button" type="button">Return to page</button>
        </div>
        <div id="downloads-list" class="downloads-list" aria-live="polite"></div>
      </section>

      <div id="open-warning" class="dialog" role="dialog" aria-modal="true" aria-labelledby="open-warning-title" hidden>
        <div class="dialog-panel">
          <p class="eyebrow">Open a downloaded program</p>
          <h2 id="open-warning-title">Check this file before opening it.</h2>
          <p id="open-warning-message" class="dialog-message"></p>
          <div class="dialog-actions">
            <button id="cancel-open-button" class="dialog-button" type="button">Cancel</button>
            <button id="confirm-open-button" class="dialog-button dialog-confirm" type="button">Open file</button>
          </div>
        </div>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
