[package]
name = "folio-browser"
version = "0.1.1"
description = "A lightweight single-tab WebView2 browser with complete local history"
authors = ["Folio contributors"]
edition = "2024"

[lib]
name = "folio_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
tauri = { version = "=2.11.5", features = ["unstable"] }
tauri-plugin-dialog = "=2.7.2"
time = { version = "=0.3.55", features = ["formatting"] }
