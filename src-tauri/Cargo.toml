[package]
name = "folio-browser"
version = "0.2.3"
description = "A lightweight single-tab WebView2 browser with complete local history"
authors = ["Folio contributors"]
edition = "2024"

[lib]
name = "folio_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
fs2 = "=0.4.3"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tauri = { version = "=2.11.5", features = ["unstable"] }
tauri-plugin-dialog = "=2.7.2"
time = { version = "=0.3.55", features = ["formatting"] }
uuid = { version = "=1.24.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = "=0.61.3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
